name: Build Boost
description: Download & build Boost

inputs:
  version:
    description: Version to build
    required: true
  libraries:
    description: Space-separated list of libraries
    required: true
  toolset:
    description: Toolset to use
    required: false
    default: auto
  platform:
    description: Target platform
    required: false
    default: x64
  configuration:
    description: Configuration to build
    required: false
    default: release
  static:
    description: Build static libraries
    required: false
    default: 0
  static-runtime:
    description: Link to the static runtime
    required: false
    default: 0
  directory:
    description: Destination directory
    required: false

outputs:
  install_dir:
    description: Directory with Boost installation
    value: ${{ steps.build.outputs.install_dir }}
  root:
    description: Source Boost directory
    value: ${{ steps.build.outputs.root }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: egor-tensin/cmake-common
        ref: v8.0.2
        path: cmake
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: '>=3.11'

    - id: build
      env:
        WORKSPACE: ${{ github.workspace }}
        ARG_VERSION: ${{ inputs.version }}
        ARG_LIBRARIES: ${{ inputs.libraries }}
        ARG_TOOLSET: ${{ inputs.toolset }}
        ARG_PLATFORM: ${{ inputs.platform }}
        ARG_CONFIGURATION: ${{ inputs.configuration }}
        ARG_STATIC: ${{ inputs.static }}
        ARG_STATIC_RUNTIME: ${{ inputs.static-runtime }}
        ARG_DIRECTORY: ${{ inputs.directory }}
      run: |
        $version = $env:ARG_VERSION
        $libraries = $env:ARG_LIBRARIES.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)

        if (-not $libraries) {
            echo @'
        ::warning ::
        No Boost libraries were explicitly selected for building, going to try to build them all.
        This is likely to fail.
        '@
        }

        $toolset = $env:ARG_TOOLSET
        $platform = $env:ARG_PLATFORM
        $configuration = $env:ARG_CONFIGURATION.ToLower()
        $static = $env:ARG_STATIC -eq '1'
        $static_runtime = $env:ARG_STATIC_RUNTIME -eq '1'

        $cache_dir = Join-Path $env:WORKSPACE ..
        $boost_dir = $env:ARG_DIRECTORY
        if (-not $boost_dir) {
            $boost_dir = Join-Path $cache_dir boost
        }

        $link = if ($static) {'static'} else {'shared'}
        $runtime_link = if ($static_runtime) {'static'} else {'shared'}

        $env:PYTHONPATH = Join-Path $env:WORKSPACE cmake

        python -m project.boost.download --cache $cache_dir -- $version $boost_dir
        python -m project.boost.build `
            --toolset $toolset `
            --platform $platform `
            --configuration $configuration `
            --link $link `
            --runtime-link $runtime_link `
            -- `
            $boost_dir `
            $libraries

        $platformdir = $platform
        if ($platformdir -eq 'auto' -and '${{ runner.os }}' -eq 'Windows') {
            $platformdir = 'x64'
        }
        $install_dir = Join-Path $boost_dir 'install_dir' $platformdir $configuration

        echo "root=$boost_dir"          >> $env:GITHUB_OUTPUT
        echo "install_dir=$install_dir" >> $env:GITHUB_OUTPUT
      shell: pwsh

branding:
  icon: star
  color: green
