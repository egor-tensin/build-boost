name: Check that Boost libraries were built
description: Check that Boost libraries were built
inputs:
  install_dir:
    description: Boost installation directory
    required: true
  libraries:
    description: Libraries to check
    required: true
  toolset:
    description: Toolset used
    required: false
    default: auto
  static:
    description: Look for static libraries
    required: false
    default: 0
runs:
  using: composite
  steps:
    - env:
        ARG_INSTALL_DIR: ${{ inputs.install_dir }}
        ARG_LIBRARIES: ${{ inputs.libraries }}
        ARG_TOOLSET: ${{ inputs.toolset }}
        ARG_STATIC: ${{ inputs.static }}
      run: |
        $windows_host = '${{ runner.os }}' -eq 'Windows'

        $install_dir = $env:ARG_INSTALL_DIR
        $toolset = $env:ARG_TOOLSET
        $static = $env:ARG_STATIC -eq '1'

        $include_dir = Join-Path $install_dir 'include'
        $lib_dir = Join-Path $install_dir 'lib'

        echo '========================= install_dir/ ========================='
        ls $install_dir
        echo '============================= lib/ ============================='
        ls $lib_dir
        echo '================================================================'

        $path = Join-Path $include_dir 'boost' config.hpp
        $(Test-Path $path -Type Leaf) -or $(throw "Couldn't find config.hpp at: $path")

        if ($static) {
            $prefix = 'lib'
            $ext = '.a'
            if ($windows_host -and $toolset -in @('auto', 'clang', 'msvc')) {
                $ext = '.lib'
            }
        } else {
            $prefix = 'lib'
            if ($windows_host -and $toolset -in @('auto', 'clang', 'msvc')) {
                $prefix = ''
            }
            $ext = '.so'
            if ($windows_host) {
                $ext = '.dll'
            }
        }

        $expected = $env:ARG_LIBRARIES.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
        $expected = $expected | %{"${prefix}boost_$_$ext"}

        foreach ($lib in $expected) {
            $path = Join-Path $lib_dir $lib
            $(Test-Path $path -Type Leaf) -or $(throw "Couldn't find Boost library at: $path")
        }
      shell: pwsh
