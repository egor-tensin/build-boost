name: Boost.Python

on:
  push:
  schedule:
    # Weekly, at 00:30 UTC on Friday (somewhat randomly chosen).
    - cron: '30 00 * * 5'
  workflow_dispatch:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - version: '1.91.0'

    runs-on: '${{ matrix.os }}'

    name: 'Boost.Python: ${{ matrix.version }} / ${{ matrix.os }}'

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Boost
        uses: actions/cache@v6
        with:
          path: '${{ runner.workspace }}/boost_*.tar.gz'
          key: 'boost-${{ matrix.version }}'

      - id: build
        name: Build Boost
        uses: ./
        with:
          version: '${{ matrix.version }}'
          libraries: python
          static-runtime: 1

      - name: Build an example module
        run: |
          mkdir build | Out-Null
          cmake `
              -D 'Boost_ROOT=${{ steps.build.outputs.install_dir }}' `
              -D CMAKE_BUILD_TYPE=Release `
              -B build `
              -S ./test/python
          cmake --build build --config Release
